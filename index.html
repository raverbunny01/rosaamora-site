<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa Amora</title>
<link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/natural-mono" type="text/css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav">
  <a href="#contact">Contact</a>
</nav>

<main>

  <section class="home">
    <img class="home-logo" src="assets/rosaamoraart.png" alt="Rosa Amora">
  </section>

  <section class="collection section-1">
    <div class="art-grid">
      <figure class="art-piece piece-a">
        <img src="assets/img/1-colourful/45.jpg" alt="Illustration, collection 1, piece 1">
      </figure>
      <figure class="art-piece piece-b">
        <img src="assets/img/1-colourful/46.jpg" alt="Illustration, collection 1, piece 2">
      </figure>
    </div>
  </section>

  <section class="collection section-2">
    <div class="pair-row pair-row--tall">
      <figure class="art-piece">
        <img src="assets/img/2-red/42.jpg" alt="Illustration, collection 2, piece 1">
      </figure>
      <figure class="art-piece">
        <img src="assets/img/2-red/60.jpg" alt="Illustration, collection 2, piece 2">
      </figure>
    </div>
  </section>

  <section class="collection section-2-1">
    <figure class="art-piece solo-piece solo-piece--wide">
      <img src="assets/img/2-red/51.jpg" alt="Illustration, collection 2, piece 3">
    </figure>
  </section>

  <section class="collection section-3">
    <div class="art-grid-4">
      <div class="art-piece cell cell--pair">
        <img src="assets/img/3-religious/50.jpg" alt="Illustration, collection 3, piece 1">
        <img src="assets/img/3-religious/tiger.jpg" alt="Illustration, collection 3, piece 1b">
      </div>
      <figure class="art-piece cell">
        <img src="assets/img/3-religious/42.jpg" alt="Illustration, collection 3, piece 2">
      </figure>
      <figure class="art-piece cell">
        <img src="assets/img/3-religious/43.jpg" alt="Illustration, collection 3, piece 3">
      </figure>
      <figure class="art-piece cell">
        <img src="assets/img/3-religious/57.jpg" alt="Illustration, collection 3, piece 4">
      </figure>
    </div>
  </section>

  <section class="collection section-4">
    <figure class="art-piece solo-piece solo-piece--poster">
      <img src="assets/img/4-solo/56.jpg" alt="Illustration, collection 4">
    </figure>
  </section>

  <section class="collection section-5 contact-section" id="contact">
    <div class="contact-info">
      <a href="mailto:hello@rosaamora.art">hello@rosaamora.art</a>
      <a href="https://www.instagram.com/rosaamoraart" target="_blank" rel="noopener">Instagram</a>
    </div>
  </section>

</main>

<script src="assets/nav.js"></script>
</body>
</html>
